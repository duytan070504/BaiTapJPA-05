spring.application.name=bai05
server.port=8090

# ===== View resolver (JSP) =====
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/static/**

# ===== Database (SQL Server) =====
# Mat khau that nam trong file application-local.properties (khong day len GitHub)
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bai05;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=doi-trong-file-local
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Unicode =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true